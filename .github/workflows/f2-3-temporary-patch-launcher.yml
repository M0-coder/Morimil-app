name: F2.3 Temporary Patch Launcher

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f2-3-temporary-patch-launcher.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f2-3-legacy-memory-convergence

      - name: Extract and run the exact patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/morimil/app/data/genesis/ultra/LegacyMemoryConvergenceCoordinator.kt')
          source = path.read_text()
          source = source.replace('        val tipHash = events.lastOrNull()?.eventHash\n', '', 1)
          pattern = re.compile(
              r'        if \(events\.isEmpty\(\)\) \{\n'
              r'            require\(localIdentityCount == 0 && genesisCoreCount == 0\) \{[\s\S]*?\n'
              r'            \}\n'
              r'            val complete = completeState\(',
              re.MULTILINE
          )
          replacement = '''        if (events.isEmpty()) {
              if (localIdentityCount != 0 || genesisCoreCount != 0) {
                  block(
                      identity = identity,
                      events = events,
                      dryRunDigest = dryRunDigest,
                      failureCode = "legacy_convergence_identity_without_memory"
                  )
                  error("legacy_convergence_identity_without_memory")
              }
              val complete = completeState('''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'coordinator empty lineage structural match={count}')
          source = source.replace(
              '                verifyLegacyChain = memoryIntegrityCore::verifyMemoryEventChain,\n',
              '                verifyLegacyChain = { events ->\n'
              '                    memoryIntegrityCore.verifyMemoryEventChain(events)\n'
              '                },\n',
              1
          )
          source = source.replace(
              '                loadState = convergenceDao::loadState,\n',
              '                loadState = { convergenceDao.loadState() },\n',
              1
          )
          path.write_text(source)
          PY

          awk '
            /^          python - <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/f2-3-temporary-convergence-patch.yml > /tmp/f2_3_patch.py
          test -s /tmp/f2_3_patch.py
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('/tmp/f2_3_patch.py')
          source = path.read_text()
          source, count = re.subn(
              r'# Fix the resumable coordinator before product wiring\.[\s\S]*?# Inject the sole canonical writer into the application container\.',
              '# Inject the sole canonical writer into the application container.',
              source,
              count=1
          )
          if count != 1:
              raise SystemExit(f'coordinator patch section removal={count}')
          path.write_text(source)
          PY

          set +e
          python /tmp/f2_3_patch.py > /tmp/f2_3_patch.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/f2_3_patch.log f2-3-patch-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add f2-3-patch-error.txt
            git commit -m "chore(f2.3): record exact patch failure"
            git push origin HEAD:plan-v2/f2-3-legacy-memory-convergence
            exit "$status"
          fi
          git diff --check

      - name: Commit permanent changes and remove launchers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f2-3-temporary-convergence-patch.yml
          git rm .github/workflows/f2-3-temporary-patch-launcher.yml
          git rm -f f2-3-patch-error.txt
          git add -A
          git commit -m "feat(memory): complete legacy writer convergence wiring"
          git push origin HEAD:plan-v2/f2-3-legacy-memory-convergence
