name: F2.1 Temporary Container Memory Patch

on:
  push:
    branches:
      - plan-v2/f2-1-canonical-memory-repository
    paths:
      - .github/workflows/f2-1-temporary-container-memory-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f2-1-canonical-memory-repository

      - name: Replace legacy reasoning memory dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/morimil/app/MorimilAppContainer.kt')
          source = path.read_text()
          old = '''            contextReader = RepositoryReasoningContextReader(
                memoryRepository = memoryRepository,
                memoryOrganRepository = memoryOrganRepository
            ),'''
          new = '''            contextReader = RepositoryReasoningContextReader(
                canonicalMemoryRepository = canonicalMemoryRepository,
                memoryOrganRepository = memoryOrganRepository
            ),'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one legacy reasoning reader wiring, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f2-1-temporary-container-memory-patch.yml
          git add app/src/main/java/com/morimil/app/MorimilAppContainer.kt
          git commit -m "feat(memory): wire kernel to canonical memory repository"
          git push origin HEAD:plan-v2/f2-1-canonical-memory-repository
