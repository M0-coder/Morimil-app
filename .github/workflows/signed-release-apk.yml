name: Signed Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate protected source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Signed release builds are permitted only from the protected main branch." >&2
            exit 1
          fi

      - name: Install deterministic Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_path" --install "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Build, verify, package, and destroy signing material
        shell: bash
        env:
          MORIMIL_RELEASE_KEYSTORE_BASE64: ${{ secrets.MORIMIL_RELEASE_KEYSTORE_BASE64 }}
          MORIMIL_RELEASE_STORE_PASSWORD: ${{ secrets.MORIMIL_RELEASE_STORE_PASSWORD }}
          MORIMIL_RELEASE_KEY_ALIAS: ${{ secrets.MORIMIL_RELEASE_KEY_ALIAS }}
          MORIMIL_RELEASE_KEY_PASSWORD: ${{ secrets.MORIMIL_RELEASE_KEY_PASSWORD }}
          MORIMIL_RELEASE_CERT_SHA256: ${{ secrets.MORIMIL_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/morimil-release.jks"
          cleanup() {
            rm -f "$keystore"
            unset MORIMIL_RELEASE_KEYSTORE_BASE64
            unset MORIMIL_RELEASE_STORE_PASSWORD
            unset MORIMIL_RELEASE_KEY_ALIAS
            unset MORIMIL_RELEASE_KEY_PASSWORD
            unset MORIMIL_RELEASE_CERT_SHA256
            unset MORIMIL_RELEASE_STORE_FILE
          }
          trap cleanup EXIT

          required=(
            MORIMIL_RELEASE_KEYSTORE_BASE64
            MORIMIL_RELEASE_STORE_PASSWORD
            MORIMIL_RELEASE_KEY_ALIAS
            MORIMIL_RELEASE_KEY_PASSWORD
            MORIMIL_RELEASE_CERT_SHA256
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "$MORIMIL_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          export MORIMIL_RELEASE_STORE_FILE="$keystore"

          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleRelease

          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$apk"

          mkdir -p release-output
          "$apksigner" verify --verbose --print-certs "$apk" \
            | tee release-output/app-release-signature.txt

          actual_fingerprint="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              release-output/app-release-signature.txt \
              | head -n 1 \
              | tr -d ':[:space:]' \
              | tr '[:upper:]' '[:lower:]'
          )"
          expected_fingerprint="$(
            printf '%s' "$MORIMIL_RELEASE_CERT_SHA256" \
              | tr -d ':[:space:]' \
              | tr '[:upper:]' '[:lower:]'
          )"

          [[ "$actual_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "Release certificate fingerprint does not match the pinned production fingerprint." >&2
            exit 1
          fi

          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          cp "$apk" release-output/app-release.apk
          printf '%s  app-release.apk\n' "$apk_sha256" \
            > release-output/app-release.apk.sha256
          {
            printf 'certificate_sha256=%s\n' "$actual_fingerprint"
            printf 'apk_sha256=%s\n' "$apk_sha256"
            printf 'source_commit=%s\n' "$GITHUB_SHA"
          } > release-output/release-signing-manifest.txt

      # The only post-signing external action. It receives release-output only;
      # release secrets and the materialized keystore remain step-local and destroyed.
      - name: Upload verified signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: morimil-signed-release-${{ github.sha }}
          path: release-output/**
          if-no-files-found: error
          retention-days: 30
