name: F1.3 Temporary Runtime Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'plan-v2/f1-3-runtime-gate'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f1-3-runtime-gate

      - name: Apply exact runtime startup patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/morimil/app/ui/MorimilViewModel.kt')
          source = path.read_text()
          marker = 'container.genesisUltraRuntimeStartupGate.requireReady()'
          start_marker = '''        viewModelScope.launch(Dispatchers.IO) {
              when (repository.readLocalBirthState()) {'''.replace('              when', '            when')
          end_marker = '''        viewModelScope.launch {
              recentMemoryEvents.collect {'''.replace('              recent', '            recent')
          replacement = '''        viewModelScope.launch(Dispatchers.IO) {
              runCatching {
                  container.genesisUltraRuntimeStartupGate.requireReady()
              }.onSuccess {
                  reasoningTranscriptRepository.seedIntroTurnsIfNeeded()
                  refreshGenesis()
              }.onFailure { error ->
                  recordInternalRuntimeIssue(
                      component = "genesis_ultra_runtime_gate",
                      message = error.message
                          ?: "Genesis Ultra runtime identity could not be verified.",
                      failureCount = 1,
                      occurredAtMillis = System.currentTimeMillis()
                  )
              }
          }
          '''.replace('              runCatching', '            runCatching') \
             .replace('                  container', '                container') \
             .replace('              }.onSuccess', '            }.onSuccess') \
             .replace('                  reasoning', '                reasoning') \
             .replace('                  refreshGenesis', '                refreshGenesis') \
             .replace('              }.onFailure', '            }.onFailure') \
             .replace('                  recordInternal', '                recordInternal') \
             .replace('                      component', '                    component') \
             .replace('                      message', '                    message') \
             .replace('                          ?:', '                        ?:') \
             .replace('                      failureCount', '                    failureCount') \
             .replace('                      occurredAtMillis', '                    occurredAtMillis') \
             .replace('                  )', '                )') \
             .replace('              }\n          }', '            }\n        }')

          if marker not in source:
              if source.count(start_marker) != 1:
                  raise SystemExit(
                      f'expected exactly one legacy startup start, found {source.count(start_marker)}'
                  )
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              source = source[:start] + replacement + source[end:]
              source = source.replace(
                  'import com.morimil.app.MorimilAppContainer\n',
                  'import com.morimil.app.MorimilAppContainer\nimport com.morimil.app.genesisUltraRuntimeStartupGate\n',
                  1
              )
              source = source.replace('import com.morimil.app.data.repository.LocalBirthState\n', '')
              source = source.replace(
                  '        refreshGenesis()\n        refreshChatOrganismStatus()\n',
                  '        refreshChatOrganismStatus()\n',
                  1
              )
              path.write_text(source)

          final = path.read_text()
          forbidden = (
              'repository.readLocalBirthState()',
              'LocalBirthState.',
              'repository.seedInitialStateIfNeeded()',
              'runObservedInternalTask("rest_cycle.startup")',
              'runObservedInternalTask("recall.startup")'
          )
          present = [token for token in forbidden if token in final]
          if present:
              raise SystemExit(f'legacy startup residue remained: {present}')
          if marker not in final:
              raise SystemExit('canonical runtime gate marker missing')
          PY

      - name: Commit patched ViewModel
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/morimil/app/ui/MorimilViewModel.kt; then
            echo "Runtime startup patch already applied."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/morimil/app/ui/MorimilViewModel.kt
          git commit -m "feat(runtime): gate ViewModel startup on Genesis Ultra"
          git push origin HEAD:plan-v2/f1-3-runtime-gate
