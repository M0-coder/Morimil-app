name: F1.3 Finalize Temporary Runtime Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'plan-v2/f1-3-runtime-gate'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f1-3-runtime-gate

      - name: Normalize runtime gate block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/morimil/app/ui/MorimilViewModel.kt')
          lines = path.read_text().splitlines()
          marker = 'container.genesisUltraRuntimeStartupGate.requireReady()'
          marker_indexes = [index for index, line in enumerate(lines) if marker in line]
          if len(marker_indexes) != 1:
              raise SystemExit(f'expected one runtime gate marker, found {len(marker_indexes)}')

          marker_index = marker_indexes[0]
          start = next(
              index for index in range(marker_index, -1, -1)
              if lines[index].strip() == 'viewModelScope.launch(Dispatchers.IO) {'
          )
          end = next(
              index for index in range(marker_index + 1, len(lines))
              if lines[index].strip() == 'viewModelScope.launch {'
          )
          block = '''        viewModelScope.launch(Dispatchers.IO) {
              runCatching {
                  container.genesisUltraRuntimeStartupGate.requireReady()
              }.onSuccess {
                  reasoningTranscriptRepository.seedIntroTurnsIfNeeded()
                  refreshGenesis()
              }.onFailure { error ->
                  recordInternalRuntimeIssue(
                      component = "genesis_ultra_runtime_gate",
                      message = error.message
                          ?: "Genesis Ultra runtime identity could not be verified.",
                      failureCount = 1,
                      occurredAtMillis = System.currentTimeMillis()
                  )
              }
          }'''
          block_lines = [line[2:] if line.startswith('  ') else line for line in block.splitlines()]
          lines = lines[:start] + block_lines + lines[end:]
          final = '\n'.join(lines) + '\n'

          forbidden = (
              'repository.readLocalBirthState()',
              'LocalBirthState.',
              'repository.seedInitialStateIfNeeded()',
              'runObservedInternalTask("rest_cycle.startup")',
              'runObservedInternalTask("recall.startup")'
          )
          present = [token for token in forbidden if token in final]
          if present:
              raise SystemExit(f'legacy startup residue remained: {present}')
          if final.count(marker) != 1:
              raise SystemExit('runtime gate marker count invalid')
          path.write_text(final)
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/f1-3-temporary-source-export.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/morimil/app/ui/MorimilViewModel.kt
          git commit -m "chore(f1.3): finalize verified runtime startup gate"
          git push origin HEAD:plan-v2/f1-3-runtime-gate
