name: Genesis Body Preparation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/prepare-genesis-ultra-body-v0-1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-body-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate wrapper and project
        run: ./gradlew --no-daemon --stacktrace --console=plain help

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:testDebugUnitTest > unit-test.log 2>&1
          status=$?
          tail -n 250 unit-test.log
          exit "$status"

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:lintDebug

      - name: Build debug APK and instrumentation tests
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Confirm release signing fails closed without material
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:validateReleaseSigning > release-signing-missing.log 2>&1
          status=$?
          tail -n 120 release-signing-missing.log
          if [[ "$status" -eq 0 ]]; then
            echo "Release signing validation unexpectedly accepted missing material." >&2
            exit 1
          fi
          grep -q "Missing release signing inputs" release-signing-missing.log

      - name: Install emulator and managed-device system images
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses > sdk-licenses.log 2>&1 || true
          "$sdkmanager_path" --install \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-30;aosp_atd;x86" \
            "system-images;android-35;default;x86_64" > sdk-install.log 2>&1
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -d "$ANDROID_HOME/system-images/android-30/aosp_atd/x86"
          test -d "$ANDROID_HOME/system-images/android-35/default/x86_64"
          "$ANDROID_HOME/emulator/emulator" -version > emulator-version.log 2>&1 || true

      - name: Build and verify release with ephemeral CI certificate
        shell: bash
        env:
          MORIMIL_RELEASE_STORE_FILE: ${{ runner.temp }}/morimil-ci-release.jks
          MORIMIL_RELEASE_STORE_PASSWORD: morimil-ci-password-v1
          MORIMIL_RELEASE_KEY_ALIAS: morimil-ci-release
          MORIMIL_RELEASE_KEY_PASSWORD: morimil-ci-password-v1
        run: |
          set -euo pipefail
          trap 'rm -f "$MORIMIL_RELEASE_STORE_FILE"' EXIT

          keytool -genkeypair \
            -keystore "$MORIMIL_RELEASE_STORE_FILE" \
            -storepass "$MORIMIL_RELEASE_STORE_PASSWORD" \
            -keypass "$MORIMIL_RELEASE_KEY_PASSWORD" \
            -alias "$MORIMIL_RELEASE_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 2 \
            -dname "CN=Morimil CI,O=Morimil CI,C=PE" \
            -noprompt

          set +e
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:assembleRelease > release-build.log 2>&1
          status=$?
          tail -n 180 release-build.log
          set -e
          [[ "$status" -eq 0 ]]

          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$apk"
          "$apksigner" verify --verbose --print-certs "$apk" | tee release-signature.log
          fingerprint="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-signature.log \
              | head -n 1 \
              | tr -d ':[:space:]'
          )"
          [[ "$fingerprint" =~ ^[0-9a-fA-F]{64}$ ]]

      - name: Enable KVM for managed devices
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run managed Android tests on API 30 and API 35
        shell: bash
        run: |
          set +e
          ./gradlew --continue --no-daemon --stacktrace --console=plain \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            :app:pixel2Api30DebugAndroidTest \
            :app:pixel2Api35DebugAndroidTest > managed-device.log 2>&1
          status=$?
          tail -n 400 managed-device.log
          exit "$status"

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: morimil-validation-reports
          if-no-files-found: ignore
          path: |
            unit-test.log
            release-signing-missing.log
            release-build.log
            release-signature.log
            managed-device.log
            sdk-licenses.log
            sdk-install.log
            emulator-version.log
            app/schemas/**
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/managed_device_android_test_additional_output/**
            app/build/outputs/apk/debug/**
