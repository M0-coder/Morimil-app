name: SBOM

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-ci-lock-state:
    name: Generate bounded CI lock completion evidence
    if: github.event.pull_request.number == 168 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Verify bounded parent and toolchain
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "dc32d4f32ef3a2391879326437929cb386b9e871"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/sbom.yml"
          test -x "${JAVA_HOME_17_X64}/bin/java"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME_17_X64}/bin" >> "${GITHUB_PATH}"
          "${JAVA_HOME_17_X64}/bin/java" -version
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          test "$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)" = "5f9268f82d5493073db7884c5706f096473ac607e9ebb36ad1e629e5cae75d11"
          grep -F '# Document status: CURRENT' SECURITY.md
          grep -F 'deactivateDependencyLocking()' tools/quality/android-unit-coverage.init.gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Preserve audited before-state
        run: |
          set -euo pipefail
          mkdir -p build/quality/qa6-ci-lock
          cp app/gradle.lockfile build/quality/qa6-ci-lock/gradle.lockfile.before
          cp gradle/verification-metadata.xml build/quality/qa6-ci-lock/verification-metadata.before.xml

      - name: Generate lock and verification state from real CI task graph
        run: |
          set -euo pipefail
          ./gradlew \
            --dependency-verification=lenient \
            --write-locks \
            --write-verification-metadata sha256 \
            --init-script tools/quality/android-unit-coverage.init.gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:createDebugUnitTestCoverageReport \
            :app:lintDebug \
            :app:assembleDebugAndroidTest \
            :app:assembleDebug

      - name: Validate bounded generated state
        run: |
          set -euo pipefail
          kotlin_line="$(grep '^org.jetbrains.kotlin:kotlin-stdlib-common:2.3.10=' app/gradle.lockfile)"
          printf '%s\n' "$kotlin_line"
          printf '%s\n' "$kotlin_line" | grep -F 'debugAndroidTestRuntimeClasspath'
          if grep -E '(^|,)jacoco(Agent|Ant)(,|$)' app/gradle.lockfile; then
            echo 'Ephemeral JaCoCo configuration leaked into dependency lock state' >&2
            exit 1
          fi
          grep -F '<component group="org.jacoco"' gradle/verification-metadata.xml
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'TRACKED_GENERATED_CHANGES=%s\n' "${changed[*]}"
          expected=("app/gradle.lockfile" "gradle/verification-metadata.xml")
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          sha256sum \
            build/quality/qa6-ci-lock/gradle.lockfile.before \
            app/gradle.lockfile \
            build/quality/qa6-ci-lock/verification-metadata.before.xml \
            gradle/verification-metadata.xml \
            > build/quality/qa6-ci-lock/sha256sums.txt
          git diff -- app/gradle.lockfile > build/quality/qa6-ci-lock/gradle-lockfile.diff
          git diff -- gradle/verification-metadata.xml > build/quality/qa6-ci-lock/verification-metadata.diff
          cp app/gradle.lockfile build/quality/qa6-ci-lock/gradle.lockfile.after
          cp gradle/verification-metadata.xml build/quality/qa6-ci-lock/verification-metadata.after.xml

      - name: Upload bounded CI lock-completion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: morimil-qa6-ci-lock-completion-${{ github.event.pull_request.head.sha }}
          path: build/quality/qa6-ci-lock/
          if-no-files-found: error
          retention-days: 30
