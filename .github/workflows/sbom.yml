name: SBOM

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-jacoco-runtime:
    name: Audit and pin instrumented JaCoCo runtime checksum
    if: github.event.pull_request.number == 168 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Verify bounded parent and frozen state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "76fe586c14edcdaea4b66731450ab4946a4f387c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/sbom.yml"
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          test "$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)" = "7b5ac701da2cc62cff7ea430672d25c94c187c4c0e00c7f3ad8c0c8f9b1bdb79"
          python3 -m unittest tools.quality.test_qa6_locking_boundary_v1

      - name: Select hosted JDK 17
        run: |
          set -euo pipefail
          test -x "${JAVA_HOME_17_X64}/bin/java"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME_17_X64}/bin" >> "${GITHUB_PATH}"
          "${JAVA_HOME_17_X64}/bin/java" -version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Capture immutable before state
        run: |
          set -euo pipefail
          mkdir -p build/quality/qa6-jacoco-runtime
          cp gradle/verification-metadata.xml build/quality/qa6-jacoco-runtime/verification-metadata.before.xml
          cp app/gradle.lockfile build/quality/qa6-jacoco-runtime/gradle.lockfile.before
          sha256sum gradle/verification-metadata.xml app/gradle.lockfile \
            | tee build/quality/qa6-jacoco-runtime/before.sha256

      - name: Independently fetch Maven Central JaCoCo runtime artifact
        run: |
          set -euo pipefail
          base='https://repo.maven.apache.org/maven2/org/jacoco/org.jacoco.agent/0.8.11'
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$base/org.jacoco.agent-0.8.11-runtime.jar" \
            --output build/quality/qa6-jacoco-runtime/org.jacoco.agent-0.8.11-runtime.jar
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            "$base/org.jacoco.agent-0.8.11-runtime.jar.sha1" \
            --output build/quality/qa6-jacoco-runtime/org.jacoco.agent-0.8.11-runtime.jar.sha1
          test "$(stat -c '%s' build/quality/qa6-jacoco-runtime/org.jacoco.agent-0.8.11-runtime.jar)" = "300661"
          expected_sha1="$(tr -d '[:space:]' < build/quality/qa6-jacoco-runtime/org.jacoco.agent-0.8.11-runtime.jar.sha1)"
          actual_sha1="$(sha1sum build/quality/qa6-jacoco-runtime/org.jacoco.agent-0.8.11-runtime.jar | cut -d' ' -f1)"
          test "$actual_sha1" = "$expected_sha1"
          sha256sum build/quality/qa6-jacoco-runtime/org.jacoco.agent-0.8.11-runtime.jar \
            | tee build/quality/qa6-jacoco-runtime/maven-central.sha256

      - name: Generate missing checksum through Gradle
        run: |
          set -euo pipefail
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --write-verification-metadata sha256 \
            --init-script tools/quality/android-instrumented-coverage.init.gradle \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            > build/quality/qa6-jacoco-runtime/gradle-generation.log 2>&1
          cp gradle/verification-metadata.xml build/quality/qa6-jacoco-runtime/verification-metadata.after.xml
          cp app/gradle.lockfile build/quality/qa6-jacoco-runtime/gradle.lockfile.after
          sha256sum gradle/verification-metadata.xml app/gradle.lockfile \
            | tee build/quality/qa6-jacoco-runtime/after.sha256

      - name: Validate exact one-artifact delta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {"v": "https://schema.gradle.org/dependency-verification"}
          root = Path("build/quality/qa6-jacoco-runtime")

          def snapshot(path: Path):
              xml_root = ET.parse(path).getroot()
              configuration = xml_root.find("v:configuration", ns)
              components = xml_root.find("v:components", ns)
              assert configuration is not None and components is not None
              entries = {}
              for component in components:
                  coordinate = (
                      component.attrib["group"],
                      component.attrib["name"],
                      component.attrib["version"],
                  )
                  for artifact in component.findall("v:artifact", ns):
                      entries[coordinate + (artifact.attrib["name"],)] = tuple(
                          (
                              child.tag.rsplit("}", 1)[-1],
                              child.attrib.get("value"),
                              child.attrib.get("origin"),
                          )
                          for child in artifact
                      )
              return ET.tostring(configuration, encoding="unicode"), entries

          before_config, before = snapshot(root / "verification-metadata.before.xml")
          after_config, after = snapshot(root / "verification-metadata.after.xml")
          assert before_config == after_config, "verification configuration changed"
          removed = set(before) - set(after)
          changed = {k for k in before if k in after and before[k] != after[k]}
          added = set(after) - set(before)
          expected = (
              "org.jacoco",
              "org.jacoco.agent",
              "0.8.11",
              "org.jacoco.agent-0.8.11-runtime.jar",
          )
          assert removed == set(), removed
          assert changed == set(), changed
          assert added == {expected}, added
          checksums = after[expected]
          assert len(checksums) == 1, checksums
          algorithm, value, origin = checksums[0]
          assert algorithm == "sha256", algorithm
          assert value and re.fullmatch(r"[0-9a-f]{64}", value), value
          assert origin == "Generated by Gradle", origin
          direct_sha256 = hashlib.sha256(
              (root / "org.jacoco.agent-0.8.11-runtime.jar").read_bytes()
          ).hexdigest()
          assert value == direct_sha256, (value, direct_sha256)
          assert (root / "gradle.lockfile.before").read_bytes() == (
              root / "gradle.lockfile.after"
          ).read_bytes(), "lockfile changed"
          summary = {
              "schema": "morimil.qa6.jacoco_runtime_checksum_audit.v1",
              "artifact": "org.jacoco:org.jacoco.agent:0.8.11:org.jacoco.agent-0.8.11-runtime.jar",
              "sha256": value,
              "added": 1,
              "removed": 0,
              "existing_changed": 0,
              "lockfile_unchanged": True,
              "maven_central_sha256_match": True,
          }
          (root / "audit.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY
          git diff --exit-code -- app/gradle.lockfile

      - name: Append bounded checksum evidence
        run: |
          set -euo pipefail
          checksum="$(python3 -c 'import json; print(json.load(open("build/quality/qa6-jacoco-runtime/audit.json"))["sha256"])')"
          cat >> docs/quality/evidence/QA_6_SUPPLY_CHAIN_EVIDENCE_2026-08-06.md <<EOF

          ## Instrumented JaCoCo runtime verification completion — 2026-08-07

          \`org.jacoco:org.jacoco.agent:0.8.11:org.jacoco.agent-0.8.11-runtime.jar\`
          was resolved specifically by the managed-device coverage path. Maven Central's
          published SHA-1 was verified against the independently downloaded 300661-byte
          artifact, and its independently computed SHA-256 matched Gradle's generated
          verification record exactly.

          \`JACOCO_RUNTIME_SHA256=$checksum\`
          \`VERIFICATION_METADATA_ADDED=1\`
          \`VERIFICATION_METADATA_REMOVED=0\`
          \`EXISTING_CHECKSUMS_CHANGED=0\`
          \`APP_GRADLE_LOCKFILE_DRIFT=0\`

          Dependency verification remains strict. No additional dependency-locking
          exception is introduced by this checksum completion.
EOF
          sed -i 's/^          //' docs/quality/evidence/QA_6_SUPPLY_CHAIN_EVIDENCE_2026-08-06.md

      - name: Commit only audited JaCoCo runtime verification state
        run: |
          set -euo pipefail
          expected=(
            "docs/quality/evidence/QA_6_SUPPLY_CHAIN_EVIDENCE_2026-08-06.md"
            "gradle/verification-metadata.xml"
          )
          git diff --exit-code -- app/gradle.lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${expected[@]}"
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git diff --cached --check
          git commit -m "[QA-6] Pin instrumented JaCoCo runtime checksum [skip ci]"
          git push origin HEAD:qa/qa-6-supply-chain-truth

      - name: Upload checksum audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa6-jacoco-runtime-checksum-${{ github.event.pull_request.head.sha }}
          path: build/quality/qa6-jacoco-runtime/
          if-no-files-found: error
          retention-days: 30
