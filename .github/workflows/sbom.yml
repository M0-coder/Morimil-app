name: SBOM

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-pit-verification-metadata:
    name: Pin audited PIT verification metadata
    if: github.event.pull_request.number == 168 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Verify bounded parent and frozen state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "c9a91e2b383330b6191889e0d90904b5e9d01c46"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/sbom.yml"
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          test "$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)" = "a4ebd754704a1ba2c3d67a7dd8d5eee15718aaed91de877f93528c3692ec035d"
          grep -F 'lockMode = LockMode.STRICT' build.gradle.kts
          python3 -m unittest tools.quality.test_qa6_locking_boundary_v1

      - name: Download audited PIT verification artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/quality/qa6-pit-pin
          curl --fail --location --retry 4 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/9000655198/zip" \
            -o build/quality/qa6-pit-pin/artifact.zip
          test "$(sha256sum build/quality/qa6-pit-pin/artifact.zip | cut -d' ' -f1)" = "612919d99e1a130b8dfdaf8fc5134e30925d48247fdd3fe776b06a6e5c7fe127"
          unzip -q build/quality/qa6-pit-pin/artifact.zip -d build/quality/qa6-pit-pin/unpacked
          test "$(sha256sum build/quality/qa6-pit-pin/unpacked/verification-metadata.before.xml | cut -d' ' -f1)" = "a4ebd754704a1ba2c3d67a7dd8d5eee15718aaed91de877f93528c3692ec035d"
          test "$(sha256sum build/quality/qa6-pit-pin/unpacked/verification-metadata.after.xml | cut -d' ' -f1)" = "7b5ac701da2cc62cff7ea430672d25c94c187c4c0e00c7f3ad8c0c8f9b1bdb79"
          test "$(sha256sum build/quality/qa6-pit-pin/unpacked/gradle.lockfile.before | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          test "$(sha256sum build/quality/qa6-pit-pin/unpacked/gradle.lockfile.after | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"

      - name: Validate exact PIT metadata delta
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {"v": "https://schema.gradle.org/dependency-verification"}

          def snapshot(path: Path):
              root = ET.parse(path).getroot()
              configuration = root.find("v:configuration", ns)
              components = root.find("v:components", ns)
              assert configuration is not None and components is not None
              entries = {}
              for component in components:
                  coordinate = (
                      component.attrib["group"],
                      component.attrib["name"],
                      component.attrib["version"],
                  )
                  for artifact in component.findall("v:artifact", ns):
                      entries[coordinate + (artifact.attrib["name"],)] = tuple(
                          (
                              child.tag.rsplit("}", 1)[-1],
                              child.attrib.get("value"),
                              child.attrib.get("origin"),
                          )
                          for child in artifact
                      )
              return ET.tostring(configuration, encoding="unicode"), entries

          before_config, before = snapshot(Path("gradle/verification-metadata.xml"))
          after_path = Path("build/quality/qa6-pit-pin/unpacked/verification-metadata.after.xml")
          after_config, after = snapshot(after_path)
          assert before_config == after_config, "verification configuration changed"
          assert not (set(before) - set(after)), "verification artifacts removed"
          assert not {k for k in before if k in after and before[k] != after[k]}, "existing checksum changed"
          added = set(after) - set(before)
          assert len(added) == 27, len(added)
          for key in added:
              checksums = after[key]
              assert len(checksums) == 1, (key, checksums)
              algorithm, value, origin = checksums[0]
              assert algorithm == "sha256", (key, algorithm)
              assert value and re.fullmatch(r"[0-9a-f]{64}", value), (key, value)
              assert origin == "Generated by Gradle", (key, origin)

          required = {
              ("org.pitest", "pitest", "1.22.1", "pitest-1.22.1.jar"),
              ("org.pitest", "pitest-command-line", "1.22.1", "pitest-command-line-1.22.1.jar"),
              ("org.pitest", "pitest-entry", "1.22.1", "pitest-entry-1.22.1.jar"),
              ("org.pitest", "pitest-html-report", "1.22.1", "pitest-html-report-1.22.1.jar"),
              ("antlr", "antlr", "2.7.7", "antlr-2.7.7.jar"),
              ("org.ow2.asm", "asm-analysis", "9.9.1", "asm-analysis-9.9.1.jar"),
              ("org.apache.commons", "commons-text", "1.14.0", "commons-text-1.14.0.jar"),
              ("org.junit", "junit-bom", "5.13.1", "junit-bom-5.13.1.module"),
          }
          assert required <= added, sorted(required - added)
          print("QA6_PIT_VERIFICATION_DELTA=PASS")
          print("QA6_PIT_VERIFICATION_ADDITIONS=27")
          PY

      - name: Pin audited PIT verification metadata
        run: |
          set -euo pipefail
          cp build/quality/qa6-pit-pin/unpacked/verification-metadata.after.xml gradle/verification-metadata.xml
          test "$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)" = "7b5ac701da2cc62cff7ea430672d25c94c187c4c0e00c7f3ad8c0c8f9b1bdb79"
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          git diff --exit-code -- app/gradle.lockfile

      - name: Append PIT verification evidence
        run: |
          cat >> docs/quality/evidence/QA_6_SUPPLY_CHAIN_EVIDENCE_2026-08-06.md <<'EOF'

          ## PIT verification completion

          ```text
          PIT_VERIFICATION_RUN_ID=31195476224
          PIT_VERIFICATION_ARTIFACT_ID=9000655198
          PIT_VERIFICATION_ARTIFACT_SHA256=612919d99e1a130b8dfdaf8fc5134e30925d48247fdd3fe776b06a6e5c7fe127
          VERIFICATION_METADATA_PRE_PIT_SHA256=a4ebd754704a1ba2c3d67a7dd8d5eee15718aaed91de877f93528c3692ec035d
          VERIFICATION_METADATA_FINAL_CANDIDATE_SHA256=7b5ac701da2cc62cff7ea430672d25c94c187c4c0e00c7f3ad8c0c8f9b1bdb79
          PIT_VERIFICATION_ARTIFACTS_ADDED=27
          PIT_VERIFICATION_ARTIFACTS_REMOVED=0
          PIT_EXISTING_CHECKSUMS_CHANGED=0
          APP_GRADLE_LOCKFILE_DRIFT=0
          ```

          The added records cover the report-only PIT 1.22.1 tooling classpath and
          its resolved ANTLR, ASM, Apache Commons, and JUnit metadata. They were
          generated by Gradle from the configured repositories under a pinned
          artifact digest. This evidence does not claim a second publisher-side
          checksum channel; final acceptance requires strict-mode execution of the
          mutation pilot on the exact final PR head.
          EOF
          sed -i 's/^          //' docs/quality/evidence/QA_6_SUPPLY_CHAIN_EVIDENCE_2026-08-06.md

      - name: Commit only audited PIT verification state
        run: |
          set -euo pipefail
          expected=(
            "docs/quality/evidence/QA_6_SUPPLY_CHAIN_EVIDENCE_2026-08-06.md"
            "gradle/verification-metadata.xml"
          )
          git diff --exit-code -- app/gradle.lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${expected[@]}"
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}"
          done
          git commit -m "[QA-6] Pin audited PIT verification metadata [skip ci]"
          git push origin HEAD:qa/qa-6-supply-chain-truth
