name: SBOM

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-pit-verification-evidence:
    name: Generate bounded PIT verification evidence
    if: github.event.pull_request.number == 168 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Verify bounded parent and frozen state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "74973da23d69f3b9ebcc3098ad773423bd8bbfc4"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/sbom.yml"
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          test "$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)" = "a4ebd754704a1ba2c3d67a7dd8d5eee15718aaed91de877f93528c3692ec035d"
          test -x "${JAVA_HOME_17_X64}/bin/java"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME_17_X64}/bin" >> "${GITHUB_PATH}"
          "${JAVA_HOME_17_X64}/bin/java" -version

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Preserve audited before-state
        run: |
          set -euo pipefail
          mkdir -p build/quality/qa6-pit-verification
          cp gradle/verification-metadata.xml build/quality/qa6-pit-verification/verification-metadata.before.xml
          cp app/gradle.lockfile build/quality/qa6-pit-verification/gradle.lockfile.before

      - name: Generate PIT classpath verification metadata without running mutation
        id: generate
        run: |
          set +e
          ./gradlew \
            --dependency-verification=lenient \
            --write-verification-metadata sha256 \
            --init-script tools/quality/android-pitest-pilot.init.gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            help
          status=$?
          set -e
          cp gradle/verification-metadata.xml build/quality/qa6-pit-verification/verification-metadata.after.xml
          cp app/gradle.lockfile build/quality/qa6-pit-verification/gradle.lockfile.after
          sha256sum \
            build/quality/qa6-pit-verification/verification-metadata.before.xml \
            build/quality/qa6-pit-verification/verification-metadata.after.xml \
            build/quality/qa6-pit-verification/gradle.lockfile.before \
            build/quality/qa6-pit-verification/gradle.lockfile.after \
            > build/quality/qa6-pit-verification/sha256sums.txt
          git diff -- gradle/verification-metadata.xml > build/quality/qa6-pit-verification/verification-metadata.diff
          git diff -- app/gradle.lockfile > build/quality/qa6-pit-verification/gradle-lockfile.diff
          printf 'GRADLE_GENERATION_EXIT=%s\n' "$status" | tee build/quality/qa6-pit-verification/generation-status.txt
          exit "$status"

      - name: Validate bounded PIT metadata generation
        if: steps.generate.outcome == 'success'
        run: |
          set -euo pipefail
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          git diff --exit-code -- app/gradle.lockfile
          test "$(git diff --name-only)" = "gradle/verification-metadata.xml"
          grep -F '<component group="org.pitest"' gradle/verification-metadata.xml
          grep -F '<component group="antlr" name="antlr" version="2.7.7">' gradle/verification-metadata.xml
          grep -F '<component group="org.ow2.asm" name="asm-analysis" version="9.9.1">' gradle/verification-metadata.xml

      - name: Upload bounded PIT verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: morimil-qa6-pit-verification-${{ github.event.pull_request.head.sha }}
          path: build/quality/qa6-pit-verification/
          if-no-files-found: error
          retention-days: 30
