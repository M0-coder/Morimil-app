name: SBOM

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate resolved supply-chain evidence
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 168 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select hosted JDK 17 and verify tool runtimes
        run: |
          set -euo pipefail
          test -x "${JAVA_HOME_17_X64}/bin/java"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME_17_X64}/bin" >> "${GITHUB_PATH}"
          "${JAVA_HOME_17_X64}/bin/java" -version
          python3 - <<'PY'
          import platform
          import sys
          assert sys.version_info >= (3, 11), sys.version
          print(f"PYTHON={platform.python_version()}")
          PY

      - name: Test QA-6 supply-chain tooling
        run: PYTHONPATH=tools/quality python3 -m unittest tools.quality.test_qa6_supply_chain_report_v1 tools.quality.test_qa6_supply_chain_scope_v1

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Complete only the missing verification metadata
        run: |
          set -euo pipefail
          mkdir -p build/quality
          cp gradle/verification-metadata.xml build/quality/qa6-verification-metadata.before.xml
          test "$(sha256sum build/quality/qa6-verification-metadata.before.xml | cut -d' ' -f1)" = "c21442729b2e7b78d957763545888945e789016cc380eacd4c08415959c2a792"
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          ./gradlew \
            --dependency-verification=lenient \
            --write-verification-metadata sha256 \
            --no-daemon \
            --stacktrace \
            --console=plain \
            help

      - name: Validate bounded metadata completion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          namespace = {"v": "https://schema.gradle.org/dependency-verification"}

          def snapshot(path: Path):
              root = ET.parse(path).getroot()
              configuration = root.find("v:configuration", namespace)
              components = root.find("v:components", namespace)
              assert configuration is not None
              assert components is not None
              config_text = ET.tostring(configuration, encoding="unicode")
              entries = {}
              for component in components:
                  coordinate = (
                      component.attrib["group"],
                      component.attrib["name"],
                      component.attrib["version"],
                  )
                  for artifact in component.findall("v:artifact", namespace):
                      checksums = tuple(sorted(
                          (
                              child.tag.rsplit("}", 1)[-1],
                              child.attrib.get("value"),
                              child.attrib.get("origin"),
                          )
                          for child in artifact
                      ))
                      entries[coordinate + (artifact.attrib["name"],)] = checksums
              return config_text, entries

          before_config, before = snapshot(Path("build/quality/qa6-verification-metadata.before.xml"))
          after_config, after = snapshot(Path("gradle/verification-metadata.xml"))
          assert before_config == after_config, "Verification configuration changed"
          removed = set(before) - set(after)
          assert not removed, f"Existing artifacts were removed: {sorted(removed)}"
          changed = {key for key in before if before[key] != after[key]}
          assert not changed, f"Existing checksums changed: {sorted(changed)}"

          expected_added = {
              ("org.jetbrains.kotlinx", "kotlinx-coroutines-bom", "1.8.0", "kotlinx-coroutines-bom-1.8.0.pom"),
              ("org.junit", "junit-bom", "5.9.2", "junit-bom-5.9.2.module"),
              ("org.junit", "junit-bom", "5.9.3", "junit-bom-5.9.3.module"),
          }
          added = set(after) - set(before)
          assert added == expected_added, f"Unexpected metadata additions: {sorted(added)}"
          for key in sorted(expected_added):
              checksums = after[key]
              assert len(checksums) == 1, (key, checksums)
              algorithm, value, origin = checksums[0]
              assert algorithm == "sha256", (key, algorithm)
              assert value is not None and re.fullmatch(r"[0-9a-f]{64}", value), (key, value)
              assert origin == "Generated by Gradle", (key, origin)

          print("QA6_VERIFICATION_METADATA_COMPLETION=PASS")
          print("ADDED_ARTIFACTS=3")
          PY
          test "$(git diff --name-only)" = "gradle/verification-metadata.xml"
          git diff --exit-code -- app/gradle.lockfile

      - name: Prove strict verification, resolved inventory, and debug APK
        run: |
          ./gradlew \
            --dependency-verification=strict \
            --init-script tools/quality/qa6-supply-chain.init.gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :qa6ResolveAndLockAll \
            :app:qa6ResolvedDependencyInventory \
            :app:assembleDebug

      - name: Build resolved SBOM, APK inventory, OSV scan, and license inventory
        run: |
          python3 tools/quality/qa6_supply_chain_report_v1.py collect \
            --gradle-inventory app/build/quality/qa6/gradle-resolved-inventory.json \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --policy tools/quality/qa6_supply_chain_policy.json \
            --adjudications tools/quality/qa6_supply_chain_adjudications.json \
            --output-dir build/quality/qa6 \
            --mode baseline

      - name: Generate independent Syft APK SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: app/build/outputs/apk/debug/app-debug.apk
          format: spdx-json
          output-file: build/quality/qa6/apk-syft.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Cross-check locks, checksums, runtime scope, licenses, and APK identity
        run: |
          python3 tools/quality/qa6_supply_chain_scope_v1.py \
            --inventory app/build/quality/qa6/gradle-resolved-inventory.json \
            --lockfile app/gradle.lockfile \
            --verification-metadata gradle/verification-metadata.xml \
            --vulnerabilities build/quality/qa6/vulnerabilities.json \
            --licenses build/quality/qa6/licenses.json \
            --syft build/quality/qa6/apk-syft.spdx.json \
            --apk-inventory build/quality/qa6/apk-inventory.json \
            --policy tools/quality/qa6_supply_chain_policy.json \
            --adjudications tools/quality/qa6_supply_chain_adjudications.json \
            --output build/quality/qa6/scope-summary.json

      - name: Validate final QA-6 evidence inventory
        run: |
          set -euo pipefail
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          test -s gradle/verification-metadata.xml
          test -s app/build/quality/qa6/gradle-resolved-inventory.json
          test -s build/quality/qa6/apk-inventory.json
          test -s build/quality/qa6/licenses.json
          test -s build/quality/qa6/vulnerabilities.json
          test -s build/quality/qa6/resolved-components.spdx.json
          test -s build/quality/qa6/apk-syft.spdx.json
          test -s build/quality/qa6/summary.json
          test -s build/quality/qa6/scope-summary.json
          python3 -m json.tool app/build/quality/qa6/gradle-resolved-inventory.json > /dev/null
          python3 -m json.tool build/quality/qa6/summary.json > /dev/null
          python3 -m json.tool build/quality/qa6/scope-summary.json > /dev/null

      - name: Upload bounded QA-6 metadata-completion artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: morimil-qa6-metadata-completion-${{ github.event.pull_request.head.sha }}
          path: |
            app/gradle.lockfile
            gradle/verification-metadata.xml
            build/quality/qa6-verification-metadata.before.xml
            app/build/quality/qa6/gradle-resolved-inventory.json
            build/quality/qa6/
          if-no-files-found: error
          retention-days: 30
