name: F3.1 Export MemoryOrgan Room V8 Schema

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  export:
    if: github.head_ref == 'plan-v2/f3-1-project-vault-transactional-outbox'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f3-1-project-vault-transactional-outbox
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Generate and validate schema
        run: |
          chmod +x ./gradlew
          ./gradlew :app:kspDebugKotlin --stacktrace
          schema='app/schemas/com.morimil.app.data.local.MemoryOrganDatabase/8.json'
          test -s "$schema"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('app/schemas/com.morimil.app.data.local.MemoryOrganDatabase/8.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['database']['version'] == 8
          tables = {entity['tableName'] for entity in data['database']['entities']}
          assert 'project_vault_outbox' in tables
          PY
          changes=$(git status --porcelain -- app/schemas | awk '{$1=""; sub(/^ /,""); print}' | sort)
          test "$changes" = "$schema"
          rm -f .github/workflows/f3-1-export-room-schema.yml
          git diff --check
      - name: Commit schema and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(storage): export MemoryOrganDatabase schema v8"
          git push origin HEAD:plan-v2/f3-1-project-vault-transactional-outbox
