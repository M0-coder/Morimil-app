name: F3.1 Apply ProjectVault Outbox Wiring

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'plan-v2/f3-1-project-vault-transactional-outbox'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f3-1-project-vault-transactional-outbox
          fetch-depth: 0
      - name: Apply reproducible wiring patch
        id: patch
        shell: bash
        run: |
          set +e
          python scripts/f3_1_apply_outbox_wiring.py > /tmp/f3-1-patch.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cp /tmp/f3-1-patch.log .f3-1-wiring-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .f3-1-wiring-error.txt
            git commit -m "chore(f3.1): publish wiring diagnostic"
            git push origin HEAD:plan-v2/f3-1-project-vault-transactional-outbox
            exit "$status"
          fi
          rm -f .f3-1-wiring-error.txt
          rm -f scripts/f3_1_apply_outbox_wiring.py
          rm -f .github/workflows/f3-1-apply-outbox-wiring.yml
          git diff --check
          test ! -e scripts/f3_1_apply_outbox_wiring.py
          test ! -e .github/workflows/f3-1-apply-outbox-wiring.yml
      - name: Commit permanent wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(projects): wire recoverable ProjectVault outbox"
          git push origin HEAD:plan-v2/f3-1-project-vault-transactional-outbox
