name: F2.3 Restore Room V14 Schema

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f2-3-restore-room-v14-schema.yml

permissions:
  contents: write
  actions: read

jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f2-3-legacy-memory-convergence

      - name: Restore exact v14 Room schema from green artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8627902328/zip" \
            --output /tmp/morimil-v14-artifact.zip

          target="app/schemas/com.morimil.app.data.local.MorimilDatabase/14.json"
          mkdir -p "$(dirname "$target")"
          unzip -p /tmp/morimil-v14-artifact.zip "$target" > "$target"
          test -s "$target"
          echo "ef0c1db454933b8c06864c1b7a20c8225586fa1b4a24ff20fcf4d4526fd3d64b  $target" | sha256sum --check --strict
          printf 'remove after schema restore\n' > f2-3-v14-schema-restored.marker
          git diff --check

      - name: Commit fixture and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f2-3-restore-room-v14-schema.yml
          git add app/schemas/com.morimil.app.data.local.MorimilDatabase/14.json
          git add f2-3-v14-schema-restored.marker
          git commit -m "test(database): restore authoritative Room v14 schema"
          git push origin HEAD:plan-v2/f2-3-legacy-memory-convergence
