name: SEC-H1 maintenance inventory patch

on:
  push:
    branches:
      - executor/sec-h1-maint-pr140-setup-gradle-v6-2-0

permissions:
  contents: write

jobs:
  patch-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact maintenance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: executor/sec-h1-maint-pr140-setup-gradle-v6-2-0
          fetch-depth: 0

      - name: Apply exact governed inventory substitutions
        shell: bash
        env:
          EXPECTED_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_TRIGGER_SHA" ]]
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/test/java/com/morimil/app/architecture/GitHubWorkflowSecurityContractTest.kt")
          source = path.read_text(encoding="utf-8")
          replacements = {
              'ActionUse(".github/workflows/codeql.yml", "gradle/actions/setup-gradle", "017a9effdb900e5b5b2fddfb590a105619dca3c3", "v4.4.2")':
                  'ActionUse(".github/workflows/codeql.yml", "gradle/actions/setup-gradle", "3f131e8634966bd73d06cc69884922b02e6faf92", "v6.2.0")',
              'ActionUse(".github/workflows/signed-release-apk.yml", "gradle/actions/setup-gradle", "ed408507eac070d1f99cc633dbcf757c94c7933a", "v4")':
                  'ActionUse(".github/workflows/signed-release-apk.yml", "gradle/actions/setup-gradle", "3f131e8634966bd73d06cc69884922b02e6faf92", "v6.2.0")',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"Expected exactly one governed inventory entry: {old}")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8", newline="\n")
          PY
          rm -- .github/workflows/sec-h1-maint-inventory-patch.yml
          git diff --check
          [[ "$(git diff --numstat -- app/src/test/java/com/morimil/app/architecture/GitHubWorkflowSecurityContractTest.kt)" == $'2\t2\tapp/src/test/java/com/morimil/app/architecture/GitHubWorkflowSecurityContractTest.kt' ]]
          [[ "$(git diff --name-only | sort)" == $'.github/workflows/sec-h1-maint-inventory-patch.yml\napp/src/test/java/com/morimil/app/architecture/GitHubWorkflowSecurityContractTest.kt' ]]

      - name: Commit exact inventory maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "morimilpabfelon-cell"
          git config user.email "295708153+morimilpabfelon-cell@users.noreply.github.com"
          git add -- .github/workflows/sec-h1-maint-inventory-patch.yml \
            app/src/test/java/com/morimil/app/architecture/GitHubWorkflowSecurityContractTest.kt
          git commit -m "Update setup-gradle governed inventory"
          git push origin HEAD:refs/heads/executor/sec-h1-maint-pr140-setup-gradle-v6-2-0
