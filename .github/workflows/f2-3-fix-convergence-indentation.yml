name: F2.3 Fix Convergence Indentation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f2-3-fix-convergence-indentation.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f2-3-legacy-memory-convergence

      - name: Fix exact malformed block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/morimil/app/data/genesis/ultra/LegacyMemoryConvergenceCoordinator.kt')
          source = path.read_text()
          old = '''        if (events.isEmpty()) {
              if (localIdentityCount != 0 || genesisCoreCount != 0) {
                  block(
                      identity = identity,
                      events = events,
                      dryRunDigest = dryRunDigest,
                      failureCode = "legacy_convergence_identity_without_memory"
                  )
                  error("legacy_convergence_identity_without_memory")
              }
              val complete = completeState(
                          identity = identity,
                          events = events,
                          dryRunDigest = dryRunDigest,
                          importedCount = 0
                      )
                      saveState(complete)
                      return report(LegacyMemoryConvergenceOutcome.NO_LEGACY_MEMORY, complete)
                  }
          '''
          new = '''        if (events.isEmpty()) {
              if (localIdentityCount != 0 || genesisCoreCount != 0) {
                  block(
                      identity = identity,
                      events = events,
                      dryRunDigest = dryRunDigest,
                      failureCode = "legacy_convergence_identity_without_memory"
                  )
                  error("legacy_convergence_identity_without_memory")
              }
              val complete = completeState(
                  identity = identity,
                  events = events,
                  dryRunDigest = dryRunDigest,
                  importedCount = 0
              )
              saveState(complete)
              return report(LegacyMemoryConvergenceOutcome.NO_LEGACY_MEMORY, complete)
          }
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected exact malformed block once, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          Path('f2-3-indentation-fixed.marker').write_text('remove after bot commit\n')
          PY
          git diff --check

      - name: Commit correction and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f2-3-fix-convergence-indentation.yml
          git add app/src/main/java/com/morimil/app/data/genesis/ultra/LegacyMemoryConvergenceCoordinator.kt
          git add f2-3-indentation-fixed.marker
          git commit -m "style(memory): fix convergence indentation"
          git push origin HEAD:plan-v2/f2-3-legacy-memory-convergence
