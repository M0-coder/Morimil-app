name: F2.1 Temporary Migration Plan Patch

on:
  push:
    branches:
      - plan-v2/f2-1-canonical-memory-repository
    paths:
      - .github/workflows/f2-1-temporary-migration-plan-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f2-1-canonical-memory-repository

      - name: Switch production to effective migration plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/morimil/app/data/local/MorimilDatabaseEncryption.kt')
          source = path.read_text()
          old = '.addMigrations(*MorimilDatabaseMigrations.ALL)'
          new = '.addMigrations(*MorimilDatabaseMigrationPlan.ALL)'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one migration registration, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f2-1-temporary-migration-plan-patch.yml
          git add app/src/main/java/com/morimil/app/data/local/MorimilDatabaseEncryption.kt
          git commit -m "feat(memory): use effective migration plan for SQLCipher"
          git push origin HEAD:plan-v2/f2-1-canonical-memory-repository
