name: F2.3 Temporary Finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f2-3-temporary-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan-v2/f2-3-legacy-memory-convergence

      - name: Apply deterministic F2.3 scripts
        shell: bash
        run: |
          set +e
          {
            python tools/f2_3_prepatch.py
            python tools/f2_3_finalize.py
            git diff --check
          } > /tmp/f2_3_finalizer.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/f2_3_finalizer.log f2-3-finalizer-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/f2-3-temporary-finalizer.yml
            git add f2-3-finalizer-error.txt
            git commit -m "chore(f2.3): record finalizer failure"
            git push origin HEAD:plan-v2/f2-3-legacy-memory-convergence
            exit "$status"
          fi

      - name: Commit final permanent diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f2-3-temporary-finalizer.yml
          git rm tools/f2_3_prepatch.py tools/f2_3_finalize.py
          git rm -f f2-3-patch-error.txt f2-3-finalizer-error.txt
          git add -A
          git commit -m "feat(memory): complete legacy writer convergence wiring"
          git push origin HEAD:plan-v2/f2-3-legacy-memory-convergence
