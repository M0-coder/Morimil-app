import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

def qa6Sha256 = { File file ->
    def digest = MessageDigest.getInstance("SHA-256")
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join("")
}

def qa6ResolvableConfigurations = { project ->
    project.configurations
        .findAll { configuration -> configuration.canBeResolved }
        .sort { left, right -> left.name <=> right.name }
}

def qa6ResolveComponentGraph = { configuration ->
    configuration.incoming.resolutionResult.allComponents.toList()
}

def qa6ExternalArtifacts = { configuration ->
    def view = configuration.incoming.artifactView { spec ->
        spec.lenient(true)
        spec.componentFilter { componentId ->
            componentId instanceof ModuleComponentIdentifier
        }
    }
    view.artifacts.artifacts.toList()
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def app = root.findProject(":app")
    if (app == null) {
        throw new GradleException("QA-6 requires the :app project.")
    }

    root.tasks.register("qa6ResolveAll") { task ->
        task.group = "verification"
        task.description =
            "Resolves every component graph to enforce QA-6 dependency lock state."
        task.notCompatibleWithConfigurationCache(
            "QA-6 enumerates configurations at execution time."
        )
        task.doLast {
            def resolved = []
            def externalComponents = [] as Set
            root.allprojects.sort { left, right -> left.path <=> right.path }.each { project ->
                qa6ResolvableConfigurations(project).each { configuration ->
                    def components = qa6ResolveComponentGraph(configuration)
                    components.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            def id = component.id as ModuleComponentIdentifier
                            externalComponents << "${id.group}:${id.module}:${id.version}"
                        }
                    }
                    resolved << "${project.path}:${configuration.name}"
                }
            }
            if (resolved.isEmpty()) {
                throw new GradleException("QA-6 resolved zero configurations.")
            }
            if (externalComponents.isEmpty()) {
                throw new GradleException("QA-6 resolved zero external components.")
            }
            task.logger.lifecycle(
                "QA6_RESOLVED_CONFIGURATIONS=${resolved.size()} " +
                    "QA6_EXTERNAL_COMPONENTS=${externalComponents.size()}"
            )
        }
    }

    root.tasks.register("qa6ResolveAndLockAll") { task ->
        task.group = "verification"
        task.description =
            "Bootstraps QA-6 dependency locks by resolving every component graph."
        task.notCompatibleWithConfigurationCache(
            "QA-6 enumerates configurations at execution time."
        )
        task.doFirst {
            if (!gradle.startParameter.writeDependencyLocks) {
                throw new GradleException(
                    "qa6ResolveAndLockAll must be invoked with --write-locks."
                )
            }
        }
        task.doLast {
            def resolved = []
            def externalComponents = [] as Set
            root.allprojects.sort { left, right -> left.path <=> right.path }.each { project ->
                qa6ResolvableConfigurations(project).each { configuration ->
                    def components = qa6ResolveComponentGraph(configuration)
                    components.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            def id = component.id as ModuleComponentIdentifier
                            externalComponents << "${id.group}:${id.module}:${id.version}"
                        }
                    }
                    resolved << "${project.path}:${configuration.name}"
                }
            }
            if (resolved.isEmpty()) {
                throw new GradleException("QA-6 resolved zero configurations.")
            }
            if (externalComponents.isEmpty()) {
                throw new GradleException("QA-6 resolved zero external components.")
            }
            task.logger.lifecycle(
                "QA6_LOCKED_CONFIGURATIONS=${resolved.size()} " +
                    "QA6_LOCKED_EXTERNAL_COMPONENTS=${externalComponents.size()}"
            )
        }
    }

    app.tasks.register("qa6ResolvedDependencyInventory") { task ->
        task.group = "verification"
        task.description =
            "Writes a deterministic inventory of resolved external :app components and artifacts."
        task.notCompatibleWithConfigurationCache(
            "QA-6 serializes the live resolution result at execution time."
        )

        def outputProvider = app.layout.buildDirectory.file(
            "quality/qa6/gradle-resolved-inventory.json"
        )
        task.outputs.file(outputProvider)

        task.doLast {
            def configurationRecords = []
            def globalComponents = [:]
            def globalArtifacts = [:]

            qa6ResolvableConfigurations(app).each { configuration ->
                def componentRecords = qa6ResolveComponentGraph(configuration)
                    .findAll { component ->
                        component.id instanceof ModuleComponentIdentifier
                    }
                    .collect { component ->
                        def id = component.id as ModuleComponentIdentifier
                        [
                            group: id.group,
                            name: id.module,
                            version: id.version,
                            coordinate: "${id.group}:${id.module}:${id.version}"
                        ]
                    }
                    .sort { left, right -> left.coordinate <=> right.coordinate }

                componentRecords.each { component ->
                    globalComponents[component.coordinate] = component
                }

                def artifactRecords = qa6ExternalArtifacts(configuration)
                    .collect { artifact ->
                        def id = artifact.id.componentIdentifier
                        if (!(id instanceof ModuleComponentIdentifier)) {
                            throw new GradleException(
                                "QA-6 external artifact view returned non-module component: ${id}"
                            )
                        }
                        def module = id as ModuleComponentIdentifier
                        def file = artifact.file
                        def extension = file.name.contains(".")
                            ? file.name.tokenize(".").last()
                            : "binary"
                        def hash = qa6Sha256(file)
                        def key = [
                            module.group,
                            module.module,
                            module.version,
                            extension,
                            file.name,
                            hash
                        ].join("|")
                        [
                            group: module.group,
                            name: module.module,
                            version: module.version,
                            coordinate: "${module.group}:${module.module}:${module.version}",
                            classifier: "",
                            extension: extension,
                            type: extension,
                            fileName: file.name,
                            size: file.length(),
                            sha256: hash,
                            key: key
                        ]
                    }
                    .sort { left, right -> left.key <=> right.key }

                artifactRecords.each { artifact ->
                    globalArtifacts[artifact.key] = artifact.findAll { key, value -> key != "key" }
                }

                configurationRecords << [
                    name: configuration.name,
                    components: componentRecords,
                    artifacts: artifactRecords.collect { record ->
                        record.findAll { key, value -> key != "key" }
                    }
                ]
            }

            def outputFile = outputProvider.get().asFile
            outputFile.parentFile.mkdirs()
            def payload = [
                schema: "morimil.qa6.gradle-resolved-inventory.v1",
                gradleVersion: gradle.gradleVersion,
                projectPath: app.path,
                configurationCount: configurationRecords.size(),
                configurations: configurationRecords,
                uniqueComponents: globalComponents.values().toList()
                    .sort { left, right -> left.coordinate <=> right.coordinate },
                uniqueArtifacts: globalArtifacts.values().toList()
                    .sort { left, right ->
                        def leftKey = [
                            left.coordinate,
                            left.classifier,
                            left.extension,
                            left.fileName,
                            left.sha256
                        ].join("|")
                        def rightKey = [
                            right.coordinate,
                            right.classifier,
                            right.extension,
                            right.fileName,
                            right.sha256
                        ].join("|")
                        leftKey <=> rightKey
                    }
            ]
            outputFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(payload)) + System.lineSeparator(),
                "UTF-8"
            )
            if (payload.uniqueComponents.isEmpty()) {
                throw new GradleException("QA-6 resolved component inventory is empty.")
            }
            if (payload.uniqueArtifacts.isEmpty()) {
                throw new GradleException("QA-6 resolved artifact inventory is empty.")
            }
            task.logger.lifecycle(
                "QA6_UNIQUE_COMPONENTS=${payload.uniqueComponents.size()} " +
                    "QA6_UNIQUE_ARTIFACTS=${payload.uniqueArtifacts.size()}"
            )
        }
    }
}
