initscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.pitest:pitest-command-line:1.22.1"
        classpath "org.pitest:pitest:1.22.1"
        classpath "org.pitest:pitest-entry:1.22.1"
        classpath "org.pitest:pitest-html-report:1.22.1"
    }
}

def pitestToolClasspath = initscript.configurations.classpath

gradle.beforeProject { project ->
    if (project.path != ":app") {
        return
    }

    project.afterEvaluate {
        def productionClasses = project.files(
            project.layout.buildDirectory.dir("tmp/kotlin-classes/debug"),
            project.layout.buildDirectory.dir(
                "intermediates/javac/debug/compileDebugJavaWithJavac/classes"
            )
        )
        def testTaskProvider = project.tasks.named("testDebugUnitTest")

        project.tasks.register("pitestDebug", JavaExec) { task ->
            task.group = "verification"
            task.description =
                "Runs the bounded QA-4 PIT command-line mutation pilot for debug JVM tests."
            task.dependsOn(testTaskProvider)
            task.mainClass.set(
                "org.pitest.mutationtest.commandline.MutationCoverageReport"
            )
            task.workingDir = project.rootDir

            task.doFirst {
                def testTask = testTaskProvider.get()
                task.classpath = project.files(
                    pitestToolClasspath,
                    productionClasses,
                    testTask.testClassesDirs,
                    testTask.classpath
                )

                def reportDir = project.layout.buildDirectory
                    .dir("reports/pitest/debug")
                    .get()
                    .asFile
                reportDir.deleteRecursively()
                reportDir.mkdirs()

                def mutablePaths = productionClasses.files
                    .findAll { file -> file.exists() }
                    .collect { file -> file.absolutePath }
                    .sort()
                    .join(",")
                if (mutablePaths.isEmpty()) {
                    throw new GradleException(
                        "QA-4 PIT mutable production classpath is empty."
                    )
                }

                task.args = [
                    "--reportDir", reportDir.absolutePath,
                    "--targetClasses",
                    "com.morimil.app.data.genesis.GenesisManifestVerifierCore*",
                    "--targetTests",
                    "com.morimil.app.data.genesis.GenesisManifestVerifierCoreTest",
                    "--sourceDirs",
                    project.file("src/main/java").absolutePath,
                    "--mutableCodePaths", mutablePaths,
                    "--outputFormats", "XML,HTML",
                    "--threads", "1",
                    "--mutators", "DEFAULTS",
                    "--timestampedReports", "false",
                    "--failWhenNoMutations", "true",
                    "--mutationThreshold", "0",
                    "--coverageThreshold", "0",
                    "--verbose", "false"
                ]
            }
        }
    }
}
